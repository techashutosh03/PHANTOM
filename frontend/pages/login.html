<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHANTOM V2 - Intelligence OS Login</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-wrapper">
          <div class="big-arc-reactor">👻</div>
        </div>
        <h1 class="login-title">PHANTOM</h1>
        <p class="login-subtitle">Personal Intelligence Operating System</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="hud-input" value="commander" required placeholder="Enter username...">
        </div>

        <div class="form-group">
          <label class="form-label">Security Key</label>
          <input type="password" id="password" class="hud-input" value="phantom2026" required placeholder="Enter password...">
        </div>

        <div class="form-options">
          <label class="remember-checkbox">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember Token</span>
          </label>
          <a href="#" class="forgot-link" onclick="showForgotAlert(event)">Forgot Key?</a>
        </div>

        <button type="submit" id="loginBtn" class="glow-btn login-btn">
          <span>ACCESS SYSTEM</span>
        </button>

        <div id="loginStatus" style="margin-top: 15px; font-size: 13px; min-height: 20px;"></div>
      </form>

      <div class="security-badge">
        <span>🛡️ Security Encryption Active</span> • <span>Node.js Core</span>
      </div>
    </div>
  </div>

  <script src="../js/audioSynth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      audioSynth.playClickSound();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      const btn = document.getElementById('loginBtn');
      const statusDiv = document.getElementById('loginStatus');

      btn.innerHTML = `<div class="spinner"></div> <span>AUTHENTICATING...</span>`;
      statusDiv.innerHTML = `<span style="color: var(--primary-cyan);">Verifying encrypted credentials...</span>`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, rememberMe })
        });

        const data = await res.json();

        if (data.success) {
          audioSynth.playBootSound();
          statusDiv.innerHTML = `<span style="color: var(--neon-green);">✅ Access Granted. Initiating PHANTOM Kernel...</span>`;
          setTimeout(() => {
            window.location.href = data.redirect || '/pages/boot.html';
          }, 1200);
        } else {
          statusDiv.innerHTML = `<span style="color: var(--neon-red);">❌ ${data.message}</span>`;
          btn.innerHTML = `<span>ACCESS SYSTEM</span>`;
        }
      } catch (err) {
        statusDiv.innerHTML = `<span style="color: var(--neon-red);">❌ Server Error. Ensure backend is running.</span>`;
        btn.innerHTML = `<span>ACCESS SYSTEM</span>`;
      }
    }

    function showForgotAlert(e) {
      e.preventDefault();
      audioSynth.playClickSound();
      alert('🔒 PHANTOM OS Key Reset Protocol:\n\nDefault Credentials:\nUsername: commander\nPassword: phantom2026\n\nConfig file: backend/config/userConfig.json');
    }
  </script>
</body>
</html>
